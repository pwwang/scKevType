# The v4 corpus: the same atlases, the same register, the same states and the same
# option surface as `real-v3.yaml` — on a different **split design**.
#
# What changed from real-v3, and nothing else:
#
# * **Every atlas trains, and every atlas is tested.** In v1–v3 the corpus trained on
#   one atlas (`hao_cite`) and tested on the other five, so "does the model know cell
#   types" and "does it carry to another lab's protocol" were the same question. The
#   measurement that made the confound legible is `reports/per-dataset.md`: the pooled
#   `panel_choice` numbers of the two best fine-tuned arms are 75–77% muraro, and
#   every fine-tuned 0.8B delta run scores exactly 0.0000 on siletti. The fix is the
#   standard design. Every atlas below sits on the new `all` tier — the one tier whose
#   donors are split **four** ways — so each atlas contributes most of its donors to
#   train and holds a donor-disjoint slice back as its own test set, at the
#   `splits.test_frac` below (0.2: per atlas roughly 0.6 train / 0.1 calibration /
#   0.1 development / 0.2 test). Held back *by donor*, never by cell: one donor's
#   cells are near-duplicates of each other, so a donor straddling the split boundary
#   would leak the test set into training (`sckevtype/data/splits.py`).
# * **A test fraction.** `splits.test_frac: 0.2` is the knob that draws it. It is read
#   only by a tier whose donor draw reaches `test`; the `train` / `T2` / `T3` tiers
#   cannot see it, so a corpus built before this field existed still splits its donors
#   exactly as it did (tests/data/test_splits.py, test_v4_corpus.py).
#
# The tier is this file's own — `configs/datasets.yaml` and `configs/datasets-v4.yaml`
# are not involved (there is no `datasets-v4.yaml` to point at): a corpus config
# already carries `tier` per dataset, and the registry's tiers stay the record of the
# v1–v3 design.
#
# Everything else is real-v3 verbatim: `version: v2` (the same register, not a new
# one), the same `artifacts: artifacts/v2-at-build` the v2 and v3 corpora were drawn
# under, the same seed (20260923 — the seed describes the corpus, and a v4 record is
# the same question as its v3 record: same cell, same panel, same option order),
# `variant_policy: single` (one rendering per record), `panel.option_markers: false`
# (the option text carries the prose alone, never the marker lists), and the same six
# atlases with the same caps, label maps, tissue labels, panel draw and state budget.
# Nothing in the split change touches the state string, the instructions, the option
# keys or their order, or the family semantics: the same cell keeps the same question,
# asked once, without the answer in it. v2 and v3 are neither edited nor rebuilt —
# their corpora under `artifacts/corpus/` stay the corpora they were.
#
#     uv run --no-sync python -m sckevtype.data.build \
#         --config configs/corpus/real-v4.yaml --out artifacts/corpus/real-v4
#
# The v3 header follows, unchanged, because every property it describes still holds
# here except the tiers:
#
# The v3 corpus: the same atlases, the same register and the same states as
# `real-v2.yaml` — with two defects the author found by reading a rendered question
# taken out of it.
#
# What changed from real-v2:
#
# * **One question per cell per family.** v2 carried both renderings of a record in
#   calibration / development / test (`variant=clean` and `variant=permuted`, the
#   option-order control), so `panel_choice` was 1,819 scored rows over 1,497
#   distinct cells — every comparison weighted 322 cells twice
#   (reports/variant-redundancy.md). `variant_policy: single` below emits exactly
#   one rendering: the permuted one in train (unchanged — a model that sees the
#   true option in a fixed position learns the position), the clean one everywhere
#   else. The option-order control is dropped from this corpus version; it returns
#   as a separate arm (its own corpus, built with `variant_policy: twins`) when a
#   run needs it, rather than as a second row under this one.
# * **The option definitions no longer carry the marker lists.** v2's option text
#   ended `… . positive markers: GCG, Gcg, ARX. negative markers: …`, so a question
#   whose answer is `GCG` could be answered by string-matching the state's rank-1
#   gene instead of by knowing the type — a shortcut that is not the capability
#   under test. `panel.option_markers: false` below renders the prose alone. The
#   marker lists stay on every option as structured fields (`markers_pos` /
#   `markers_neg`), so the holds rule, the leakage guard and every derived target
#   are the ones v2 used; only the prompt text loses them.
#
# Everything else is v2 verbatim: the same `version` (so the same `artifacts/v2`
# register, not `artifacts/v3`), the same seed, the same six atlases with the same
# caps, label maps, tissue labels and tiers, the same `panel` draw, the same
# `splits`, the same `state` budget and tokenizer. Neither change touches the state
# string, the instructions, the option keys or their order, the family semantics or
# the split logic — the same cell keeps the same question, asked once, without the
# answer in it.
#
# The v2 header follows, unchanged except where the two keys above are noted:
#
# The v2 corpus: the same atlases as `real-v1.yaml`, read against `artifacts/v2`.
#
# What changed from real-v1 (docs/SPEC-step6-register-v2.md):
#
# * `version: v2`, so the run reads `artifacts/v2` — the register is no longer the 31-term hand-curated seed but
#   the 70-term set the >=95% coverage rule derived and CellMarker 2.0 could
#   ground. On Muraro (pancreas) that is the difference between 0.99% of cells
#   mapping and 89.18% — between 0 records and a corpus.
# * Every atlas that carries CL ids maps *every in-scope term to itself*. The map
#   below is `reports/step6-coverage.json` `in_scope`, written out verbatim by
#   `scripts/curate_register_v2.py`'s rule — not a second, hand-kept list. A cell
#   whose label is not a key is dropped and counted, never coerced.
# * Only `muraro` is listed. The nine-atlas run is the corpus build, which Step 6
#   §9 puts out of scope; this config exists so the register change is measured
#   end to end on real bytes now, and grows to the other atlases unchanged.
name: real-v4
# `version` labels the register version this corpus is *reported* against; `artifacts`
# below is the directory the builder actually reads. Kept at `v2`: `v3` in the corpus name
# is the corpus's own version, not a new register.
version: v2
# The register the v2 corpus was built with, frozen under a new path (`artifacts/v2-at-build`):
# the Step-9 derived tissue map (file sha256 `cce9a9c46ba1…` — the digest `runs/real-v2` recorded,
# `reports/step9.md` deviation #1) plus the canonical v2 `cl_terms.json` (`8a3f6fab0c64…`, the
# parentless form the corpus was drawn under) and the unchanged `definitions.json` /
# `render_config.json`. `artifacts/v2` on disk today is the *pre*-Step-9 tissue map and cannot
# serve this corpus at all: the build stops on `CL:0001054 is not a candidate type for tissue
# 'blood'`, for real-v2 and real-v3 alike. Nothing at HEAD is modified by pointing here — see
# `reports/real-v3-corpus.md` §1 and §2.
artifacts: artifacts/v2-at-build
# Same seed as real-v1 and real-v2: the corpus, not the register, is what a seed
# describes. Keeping it is what makes a v2 record and its v3 record the same
# question — same cell, same panel, same option order — differing only in the
# marker lists and in being asked once.
seed: 20260923
cache: data/raw
# One rendering per record, the clean one outside train: see the header.
variant_policy: single
datasets:
  # --- the v4 tier: the atlas trains *and* is tested on its own donors ---------
