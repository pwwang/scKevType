      CL:0000815: CL:0000815
      CL:0000816: CL:0000816
      CL:0000817: CL:0000817
      CL:0000860: CL:0000860
      CL:0000875: CL:0000875
      CL:0000893: CL:0000893
      CL:0000895: CL:0000895
      CL:0000897: CL:0000897
      CL:0000898: CL:0000898
      CL:0000900: CL:0000900
      CL:0000905: CL:0000905
      CL:0000907: CL:0000907
      CL:0000909: CL:0000909
      CL:0000913: CL:0000913
      CL:0000940: CL:0000940
      CL:0000988: CL:0000988
      CL:0000990: CL:0000990
      CL:0001054: CL:0001054
      CL:0002038: CL:0002038
      CL:0002063: CL:0002063
      CL:0002079: CL:0002079
      CL:0002132: CL:0002132
      CL:0002275: CL:0002275
      CL:0002326: CL:0002326
      CL:0002350: CL:0002350
      CL:0002393: CL:0002393
      CL:0002543: CL:0002543
      CL:0002623: CL:0002623
      CL:0008001: CL:0008001
      CL:0008019: CL:0008019
      CL:1000398: CL:1000398
      CL:1000413: CL:1000413
      CL:1001431: CL:1001431
      CL:1001474: CL:1001474
    # 200 cells: enough for the suite's train partition to be a real partition (and for
    # kev's row/packed limits to be measured), small enough that nobody mistakes it for
    # a training set. Its four donors split 0.2/0.2/rest: D28 train, D29 calibration,
    # D30 development, D31 train.
    cap: 200
    provenance: 'configs/datasets.yaml#muraro — Muraro et al. pancreas, CELLxGENE collection 6e8c5415-302c-492a-a5f9-f29c57ff18fb (CL-mapped); the suite-format anchor, never scored'

families: [panel_choice, panel_miss, marker_noul, evidence_diluted]

panel:
  size_min: 4
  size_max: 40
  size_dist: loguniform
  panel_miss_p: 0.25
  confusion_frac: 0.5
  source: random
  # The v4 rendering, unchanged: the option text carries the prose alone, never the
  # marker lists (which stay on the option as `markers_pos`/`markers_neg`).
  option_markers: false

splits:
  # Read only by the `train` tier (the anchor). 0.2/0.2 is what fills calibration and
  # development from four donors at this seed; v4's 0.1/0.1 leaves both empty two times
  # in three, and an empty partition is a suite the builder refuses.
  calibration_frac: 0.2
  development_frac: 0.2
  # Inert: no dataset here is on a tier whose donor draw reaches `test` (baron is `T3`,
  # muraro is `train`), so the four-way knob is not read.
  test_frac: 0.2
  # The cells the register cannot name are counted, not built: no `out_of_register`
  # family in this suite (see the header), and a 0 budget keeps them out of the donor
  # draw and the split table so the cell counts mean "cells in scope".
  unregistered: {baron: 0, muraro: 0}

state:
  max_tokens: 384
  tokens_per_symbol: 3.0
  qc_permutations: 20
  qc_max_features: 200
  tokenizer: {id: Qwen/Qwen3.5-0.8B-Base, revision: dc7cdfe2ee4154fa7e30f5b51ca41bfa40174e68}
