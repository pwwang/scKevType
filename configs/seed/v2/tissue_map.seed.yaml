source: 'tissue -> candidate CL ids (paper_plan §4.5), DERIVED by rule, not hand-appended:
  tissues[T] = scope ∩ (cellmarker(T) ∪ observed(T)). cellmarker(T) is the CL ids
  CellMarker 2.0 files under the tissue_class whose name is T, Normal rows only, via
  the resource''s own cellontology_id column (Cell_marker_Human.xlsx sha256 bf52b8cd60df,
  Cell_marker_Mouse.xlsx sha256 e66bc8e13f02); observed(T) is the CL ids an atlas
  wired to T by a corpus config carries in cells whose tissue resolves to T, read
  from the atlases'' own obs columns (configs/seed/v2/atlas_tissue_labels.json sha256
  1db8d286e320 (real-v1.yaml:dominguez_conde sha256 221dd0d46130, real-v1.yaml:muraro
  sha256 183673651cfa, real-v1.yaml:siletti sha256 0efc5e1c3d3e, real-v1.yaml:tabula_muris_senis
  sha256 35765ef90533, real-v1.yaml:tabula_sapiens sha256 9ac3d9391bd6, real-v2.yaml:dominguez_conde
  sha256 221dd0d46130, real-v2.yaml:hao_cite sha256 e33c8904af0c, real-v2.yaml:muraro
  sha256 183673651cfa, real-v2.yaml:siletti sha256 0efc5e1c3d3e, real-v2.yaml:tabula_muris_senis
  sha256 35765ef90533, real-v2.yaml:tabula_sapiens sha256 9ac3d9391bd6)); scope is
  the corpus label_map (real-v1.yaml sha256 a10d2c9a1581, real-v2.yaml sha256 a865819401bd,
  smoke.yaml sha256 bba7ad6f4e75); a term the rule places in no tissue is reported,
  never guessed. Ranked by CellMarker rows, ties by CL id. Tissue classes: blood=Blood;
  brain=Brain; liver=Liver; lung=Lung; pancreas=Pancreas. Placed 71 of 84 scope ids;
  no candidate anywhere: CL:0000050, CL:0000113, CL:0000138, CL:0000312, CL:0000362,
  CL:0000547, CL:0000575, CL:0000842, CL:0000893, CL:0002132, CL:0002320, CL:0002623,
  CL:1001431.'
