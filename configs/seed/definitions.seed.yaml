# Seed definition resource: what each candidate type means, as marker lists.
#
# SEED, NOT THE REAL THING: hand-written for the contracts build so the format,
# the digests and the leakage guard can be exercised offline. Step 2 replaces it
# with the curated resource derived from external sources (see paper_plan §4.3).
# Definitions must never be derived from the dataset being evaluated — that is
# what sckevtype.contracts.definitions.assert_no_leakage enforces.
#
# render_text() turns each entry into the exact prompt string of a panel option:
#   "<text>. positive markers: A, B. negative markers: C."
# so `text` is prose and the marker lists are the evidence.
source: "seed: hand-curated marker definitions (replace in step 2)"
version: v1
synonyms:
  # marker -> accepted aliases (curated gene synonyms; used by the synonym
  # perturbation and by nothing else — they never enter the rendered text unless
  # a perturbation deliberately swaps one in).
  MS4A1: [CD20]
  IL7R: [CD127]
  FCGR3A: [CD16]
  FCGR3B: [CD16B]
  NCAM1: [CD56]
  PECAM1: [CD31]
  PTPRC: [CD45]
  ITGAM: [CD11B]
  ITGAX: [CD11C]
  CSF1R: [CD115]
  KLRD1: [CD94]
