# Seed per-dataset label map: dataset label -> Cell Ontology id.
#
# The join key of multi-dataset training (design-notes §5). SEED: the labels
# below are a PBMC-style vocabulary, not yet wired to a real dataset — Step 2
# adds one map per dataset, built from the dataset's own annotation column, and
# the real maps are what `coverage_gate` below exists to police.
#
# `labels` is the dataset's full label vocabulary; `mapping` must cover it to at
# least `min_coverage`, or the build fails naming the labels it cannot map.
# Nothing is ever coerced to the nearest CL term: an unmappable label is dropped,
# or kept as `local:<dataset>:<label>` when allow_local_types is set.
dataset_id: seed_pbmc
source: "seed: PBMC-style vocabulary (replace with real dataset maps in step 2)"
version: v1
allow_local_types: false
min_coverage: 0.95
labels:
  - CD4 T
  - CD8 T
  - NK
  - B
  - CD14 Mono
  - FCGR3A Mono
  - DC
  - Platelet
  - Erythrocyte
  - Mast
mapping:
  CD4 T: CL:0000624
  CD8 T: CL:0000625
  NK: CL:0000623
  B: CL:0000236
  CD14 Mono: CL:0000860
  FCGR3A Mono: CL:0000875
  DC: CL:0000451
  Platelet: CL:0000233
  Erythrocyte: CL:0000232
  Mast: CL:0000097
