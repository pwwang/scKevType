# Seed Cell Ontology snapshot: the join key of the whole project.
#
# SEED, NOT THE REAL THING: this is a hand-curated subset covering the types the
# seed label map and tissue map use, so the contracts can be built and tested
# offline. Replace it before any evaluation with the real release:
#
#     python -m sckevtype.contracts.fetch --what cl --out configs/seed/cl_terms.seed.yaml
#
# The replacement is a new artifact version: CL ids are the join key, so a
# changed snapshot invalidates prior numbers by construction.
